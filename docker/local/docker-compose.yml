services:
  mysql:
    image: mysql:8.4 # 镜像
    container_name: mysql-dev # 容器
    restart: unless-stopped # 重启后容器会自动拉起，除非你手动停了它。
    environment: # 容器内环境变量（密码、库名等），值来自 .env
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE} # 首次启动创建的数据库
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      [
        "mysqld",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    ports: # 端口映射，左边本机端口，右边容器端口
      - "${MYSQL_PORT}:3306"
    volumes: # 数据挂载到本地目录，避免删容器就丢数据
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck: # 健康检查命令，决定容器是否“健康”
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2
    container_name: redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos-dev
    restart: unless-stopped
    depends_on:
      mysql: # 依赖 mysql 健康后再启动 - 先 MySQL 可用 - 再起 Nacos，连 MySQL 读写配置
        condition: service_healthy
    environment:
      TZ: ${TZ}
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql # 提前在MySQL的数据库中使用nacos官网提供的：mysql-schema.sql。来创建naocs所以要的表。
      MYSQL_SERVICE_HOST: mysql # 数据库实例数量（Nacos 兼容多库配置场景），本地一般就是 1。
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NUM: 1
      MYSQL_SERVICE_DB_NAME: ${MYSQL_DATABASE}
      MYSQL_SERVICE_USER: ${MYSQL_USER}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN}
    ports:
      - "${NACOS_HTTP_PORT}:8848"
      - "${NACOS_GRPC_PORT}:9848"
      - "${NACOS_RAFT_PORT}:9849"
    volumes:
      - ./nacos/logs:/home/nacos/logs
